name: CI

# Type-checks and builds the site on every push to main and every pull request.
# Vercel deploys from Git; its Deployment Checks wait for this job before a
# production build goes live (see README).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
